<style>
:root {
  --ink:#2E3A4A;
  --ink-soft:#6C7A88;
  --paper:#F7F2E7;
  --surface:#FFFFFF;
  --surface-2:#EFE9D8;
  --line:rgba(46,58,74,0.14);
  --moss:#7E9E82;
  --moss-deep:#5C7A96;
  --moss-tint:#E3EAE4;
  --amber:#B99230;
  --amber-tint:#F2E9D1;
  --rose:#A96C82;
  --rose-tint:#F0E2E8;
  --sky:#5F86A3;
  --sky-tint:#E1E9EF;
  --plum:#8577A0;
  --plum-tint:#EAE6F0;
  --brick:#A15C63;
  --brick-tint:#F0E1E1;
  --bg: var(--paper);
  --surface-c: var(--surface);
  --text: var(--ink);
  --text-soft: var(--ink-soft);
  --shadow: 0 1px 2px rgba(46,58,74,0.06), 0 6px 18px rgba(46,58,74,0.08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1B2027;
    --surface-c:#242B33;
    --surface-2:#2B333C;
    --line: rgba(230,232,224,0.14);
    --text:#EAE7DC;
    --text-soft:#A7AFAE;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 22px rgba(0,0,0,0.35);
    --moss-tint:#22302A; --amber-tint:#332C18; --rose-tint:#332229; --sky-tint:#1E2A34; --plum-tint:#282234; --brick-tint:#32211F;
  }
}
:root[data-theme="dark"] {
  --bg:#1B2027; --surface-c:#242B33; --surface-2:#2B333C;
  --line: rgba(230,232,224,0.14); --text:#EAE7DC; --text-soft:#A7AFAE;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 22px rgba(0,0,0,0.35);
  --moss-tint:#22302A; --amber-tint:#332C18; --rose-tint:#332229; --sky-tint:#1E2A34; --plum-tint:#282234; --brick-tint:#32211F;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
h1,h2,h3,.num,.brand,.tab,.btn,.kpad button { font-family:'Space Grotesk', 'Inter', sans-serif; }
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-0.01em; }
p { margin:0; }
button { font: inherit; }
.app { max-width: 640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

/* header */
.topbar {
  background:var(--moss-deep); color:#F4F1E6;
  padding: calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand { font-size:17px; font-weight:700; letter-spacing:-0.01em; }
.brand small { display:block; font-family:'Inter'; font-weight:400; font-size:11.5px; color:#C7D0BE; margin-top:1px; }
.whoami { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.09); padding:5px 6px 5px 5px; border-radius:999px; border:none; color:#F4F1E6; cursor:pointer; }
.avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; color:#20261D; flex-shrink:0; }
.whoami span { font-size:13px; font-weight:600; padding-right:4px; }

/* tabs */
.tabbar { display:flex; gap:4px; padding:10px 14px; background:var(--bg); position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); overflow-x:auto; }
.tab { border:none; background:transparent; color:var(--text-soft); padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap; position:relative; }
.tab.active { background:var(--moss-deep); color:#fff; }
.tab .badge { display:inline-block; min-width:16px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--brick); color:#fff; font-size:10.5px; line-height:16px; font-weight:700; }
.tab.active .badge { background:#fff; color:var(--moss-deep); }

main { flex:1; padding: 16px 14px 90px; }
.stack { display:flex; flex-direction:column; gap:12px; }
.row { display:flex; gap:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.card { background:var(--surface-c); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); }
.card.tight { padding:12px 14px; }
.card h2 { font-size:14.5px; }
.card h3 { font-size:13px; color:var(--text-soft); font-weight:600; text-transform:none; }
.muted { color:var(--text-soft); font-size:12.5px; }
.section-title { font-size:12.5px; font-weight:700; color:var(--text-soft); margin: 4px 2px 2px; }

/* wallet */

<script>
/* ---------------- constants ---------------- */
const COLORS = {
  moss:  {solid:'var(--moss)',  deep:'var(--moss-deep)', tint:'var(--moss-tint)'},
  amber: {solid:'var(--amber)', deep:'var(--amber)',      tint:'var(--amber-tint)'},
  rose:  {solid:'var(--rose)',  deep:'var(--rose)',       tint:'var(--rose-tint)'},
  sky:   {solid:'var(--sky)',   deep:'var(--sky)',        tint:'var(--sky-tint)'},
  plum:  {solid:'var(--plum)',  deep:'var(--plum)',       tint:'var(--plum-tint)'},
};
const COLOR_HEX = { moss:'#5C7A96', amber:'#B99230', rose:'#A96C82', sky:'#5F86A3', plum:'#8577A0' };
const MULT_PRESETS = [1, 1.5, 2, 3];
const CATEGORIES = ['Buanderie','Cuisine','Chambre','RDC','Jardin','École','Sport','Autre'];
const CATEGORY_ICONS = { 'Buanderie':'\u{1F9FA}', 'Cuisine':'\u{1F37D}\uFE0F', 'Chambre':'\u{1F6CF}\uFE0F', 'RDC':'\u{1F6CB}\uFE0F', 'Jardin':'\u{1F33F}', 'École':'\u{1F392}', 'Sport':'\u26BD', 'Autre':'\u{1F4CC}' };

const DEFAULT_TASKS = [
  {name:'Vider et ranger le lave-vaisselle', theoreticalMinutes:15, multiplier:2, recurring:true, category:'Cuisine'},
  {name:'Mettre la table', theoreticalMinutes:5, multiplier:2, recurring:true, category:'Cuisine'},
  {name:'Débarrasser et essuyer la table', theoreticalMinutes:10, multiplier:2, recurring:true, category:'Cuisine'},
  {name:'Ranger sa chambre', theoreticalMinutes:20, multiplier:2, recurring:true, category:'Chambre'},
  {name:'Sortir les poubelles', theoreticalMinutes:5, multiplier:2, recurring:true, category:'RDC'},
  {name:"Passer l'aspirateur au salon", theoreticalMinutes:15, multiplier:1.5, recurring:true, category:'RDC'},
  {name:'Plier et ranger le linge', theoreticalMinutes:15, multiplier:1.5, recurring:true, category:'Buanderie'},
  {name:'Désherber le jardin', theoreticalMinutes:45, multiplier:1, recurring:false, category:'Jardin'},
];

/* ---------------- state ---------------- */
const state = {
  ready:false,
  dbAvailable:null,
  configError:false,
  profiles: [],
  profilesLoaded:false,
  tasks: [],
  proposals: [],
  submissions: [],
  pinResets: [],
  wallets: {},
  timers: {},
  taskTimers: {},
  activity: [],
  currentProfileId: sessionStorage.getItem('mst_profile') || null,
  currentTab: 'accueil',
  pinBuffer: '',
  pinTargetProfile: null,
  pinError:'',
};

let db = null;

function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtMin(totalMinutes){
  const neg = totalMinutes < 0;
  const m = Math.round(Math.abs(totalMinutes));
  const h = Math.floor(m/60), r = m%60;
  let s = h>0 ? (h+'h'+(r? String(r).padStart(2,'0'):'')) : (m+' min');
  return (neg?'-':'') + s;
}
function fmtSigned(min){ return (min>=0?'+':'') + fmtMin(min).replace(/^-/,'-'); }
function fmtTime(iso){
  try{
    const d = new Date(iso);
    const today = new Date();
    const sameDay = d.toDateString()===today.toDateString();
    const time = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if(sameDay) return "aujourd'hui "+time;
    const y = new Date(today); y.setDate(y.getDate()-1);
    if(d.toDateString()===y.toDateString()) return 'hier '+time;
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+time;
  }catch(e){ return ''; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wireDigitInput(id, allowNeg){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    let v = el.value;
    v = allowNeg ? v.replace(/[^0-9-]/g,'').replace(/(?!^)-/g,'') : v.replace(/[^0-9]/g,'');
    if(v !== el.value) el.value = v;
  });
}

function currentProfile(){ return state.profiles.find(p=>p.id===state.currentProfileId) || null; }
function isParent(p){ return p && p.role==='parent'; }
function children(){ return state.profiles.filter(p=>p.role==='child'); }
function parents(){ return state.profiles.filter(p=>p.role==='parent'); }
function profileName(id){ const p = state.profiles.find(x=>x.id===id); return p? p.name : 'Quelqu\u2019un'; }

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2200);
}

/* ---------------- Supabase config & adapter ---------------- */
// 1) Créez un projet sur https://supabase.com (gratuit)
// 2) Exécutez le script SQL fourni séparément dans l'éditeur SQL de Supabase
// 3) Remplacez les deux valeurs ci-dessous par celles de Project Settings > API
const SUPABASE_URL = 'https://rvjlygkzjibwnjaralok.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2amx5Z2t6amlid25qYXJhbG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzQ2NDEsImV4cCI6MjEwNTY1MDY0MX0.RJm-cyWcS-0jBshuC4027VHWwV8KXhlNlD0AFnbQMGc';

function makeSupabaseDb(sbClient){
  function makeDocRef(table, id){
    return {
      async get(){
        const {data, error} = await sbClient.from(table).select('data').eq('id', id).maybeSingle();
        if(error) throw error;
        return { exists: !!data, data: ()=> data ? data.data : undefined, id };
      },
      async set(payload){
        const {error} = await sbClient.from(table).upsert({id, data: payload, updated_at: new Date().toISOString()});
        if(error) throw error;
      },
      async update(payload){
        const {data: existing, error: e1} = await sbClient.from(table).select('data').eq('id', id).maybeSingle();
        if(e1) throw e1;
        const merged = {...(existing?existing.data:{}), ...payload};
        const {error} = await sbClient.from(table).upsert({id, data: merged, updated_at: new Date().toISOString()});
        if(error) throw error;
      },
      async delete(){
        const {error} = await sbClient.from(table).delete().eq('id', id);
        if(error) throw error;
      },
      onSnapshot(cb, errCb){
        const refresh = async ()=>{
          try{
            const {data, error} = await sbClient.from(table).select('data').eq('id', id).maybeSingle();
            if(error) throw error;
            cb({ exists: !!data, data: ()=> data? data.data: undefined, id });
          }catch(e){ errCb && errCb(e); }
        };
        refresh();
        return sbClient.channel('doc-'+table+'-'+id+'-'+Math.random().toString(36).slice(2))
          .on('postgres_changes', {event:'*', schema:'public', table, filter:'id=eq.'+id}, refresh)
          .subscribe();
      }
    };
  }
  function makeCollectionRef(table){
    const filters = [];
    const self = {
      doc(id){ return makeDocRef(table, id); },
      where(field, op, value){ filters.push({field, op, value}); return self; },
      async add(payload){
        const id = uid(table);
        await makeDocRef(table, id).set(payload);
        return { id };
      },
      onSnapshot(cb, errCb){
        const refresh = async ()=>{
          try{
            let q = sbClient.from(table).select('id, data');
            filters.forEach(f=>{ if(f.op==='=='){ q = q.eq('data->>'+f.field, String(f.value)); } });
            const {data, error} = await q;
            if(error) throw error;
            cb({ docs: (data||[]).map(row=>({ id: row.id, data: ()=> row.data })) });
          }catch(e){ errCb && errCb(e); }
        };
        refresh();
        return sbClient.channel('col-'+table+'-'+Math.random().toString(36).slice(2))
          .on('postgres_changes', {event:'*', schema:'public', table}, refresh)
          .subscribe();
      }
    };
    return self;
  }
  return {
    collection(name){ return makeCollectionRef(name); },
    doc(path){ const [table, id] = path.split('/'); return makeDocRef(table, id); }
  };
}

/* ---------------- init ---------------- */
async function init(){
  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  if(!configured){
    db = null; state.dbAvailable = false; state.configError = true;
    render();
    return;
  }
  try{
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    db = makeSupabaseDb(sbClient);
  }catch(e){ console.error(e); db = null; }
  state.dbAvailable = !!db;
  render();
  if(!db){ return; }

  // profiles
  db.collection('profiles').onSnapshot(snap=>{
    state.profiles = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> (a.role===b.role? a.createdAt-b.createdAt : (a.role==='parent'?-1:1)));
    state.profilesLoaded = true;
    render();
  }, err=>{ console.error(err); state.profilesLoaded = true; render(); });

  db.collection('tasks').onSnapshot(snap=>{
    state.tasks = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> (b.active-a.active) || a.name.localeCompare(b.name));
    render();
  }, err=>console.error(err));

  db.collection('proposals').where('status','==','pending').onSnapshot(snap=>{
    state.proposals = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.createdAt-b.createdAt);
    render();
  }, err=>console.error(err));

  db.collection('submissions').where('status','==','pending').onSnapshot(snap=>{
    state.submissions = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.createdAt-b.createdAt);
    render();
  }, err=>console.error(err));

  db.collection('pin_reset_requests').where('status','==','pending').onSnapshot(snap=>{
    state.pinResets = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.createdAt-b.createdAt);
    render();
  }, err=>console.error(err));

  db.collection('wallets').onSnapshot(snap=>{
    const w = {};
    snap.docs.forEach(d=>{ w[d.id] = {id:d.id, ...d.data()}; });
    state.wallets = w;
    render();
  }, err=>console.error(err));

  db.collection('timers').onSnapshot(snap=>{
    const t = {};
    snap.docs.forEach(d=>{ t[d.id] = {id:d.id, ...d.data()}; });
    state.timers = t;
    startTimerTicker();
    render();
  }, err=>console.error(err));

  db.collection('task_timers').onSnapshot(snap=>{
    const t = {};
    snap.docs.forEach(d=>{ t[d.id] = {id:d.id, ...d.data()}; });
    state.taskTimers = t;
    startTimerTicker();
    render();
  }, err=>console.error(err));

  db.doc('activity/log').onSnapshot(snap=>{
    state.activity = snap.exists ? (snap.data().entries||[]) : [];
    render();
  }, err=>console.error(err));
}

/* ---------------- data writes ---------------- */
async function ensureWallet(childId, childName){
  if(state.wallets[childId]) return;
  await db.collection('wallets').doc(childId).set({childId, name:childName, balanceMinutes:0, history:[], updatedAt:nowISO()});
}

async function pushActivity(entry){
  const ref = db.doc('activity/log');
  const snap = await ref.get();
  const entries = snap.exists ? (snap.data().entries||[]) : [];
  entries.push({id:uid('act'), at:nowISO(), ...entry});
  while(entries.length > 150) entries.shift();
  await ref.set({entries, updatedAt: nowISO()});
}

async function pushWalletHistory(childId, entry){
  const ref = db.collection('wallets').doc(childId);
  const snap = await ref.get();
  const cur = snap.exists ? snap.data() : {balanceMinutes:0, history:[], name:profileName(childId)};
  const history = (cur.history||[]).slice();
  history.push({id:uid('w'), at:nowISO(), ...entry});
  while(history.length > 80) history.shift();
  const newBalance = (cur.balanceMinutes||0) + entry.amountMinutes;
  await ref.set({childId, name: cur.name || profileName(childId), balanceMinutes:newBalance, history, updatedAt:nowISO()});
  return newBalance;
}

async function setupCreateFamily(people){
  for(const p of people){
    await db.collection('profiles').doc(p.id).set({
      name:p.name, role:p.role, pin:p.pin, color:p.color, emoji:p.emoji, createdAt: Date.now()
    });
  }
  for(const t of DEFAULT_TASKS){
    const id = 'seed_' + t.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,60);
    await db.collection('tasks').doc(id).set({...t, active:true, createdAt: Date.now(), createdBy:'setup'});
  }
  for(const p of people.filter(x=>x.role==='child')){
    await db.collection('wallets').doc(p.id).set({childId:p.id, name:p.name, balanceMinutes:0, history:[], updatedAt:nowISO()});
    await db.collection('timers').doc(p.id).set({running:false, startedAt:null});
  }
}

async function submitTask(task, minutes, note){
  const me = currentProfile();
  if(!me) return;
  if(me.role === 'parent'){
    await pushActivity({type:'parent_done', taskName:task.name, byId:me.id, byName:me.name, minutes});
    toast('Tâche enregistrée. Merci !');
    return;
  }
  await db.collection('submissions').add({
    taskId: task.id, taskName: task.name, theoreticalMinutes: task.theoreticalMinutes,
    multiplier: task.multiplier, submittedMinutes: minutes, note: note||'',
    submittedBy: me.id, submittedByName: me.name, status:'pending', createdAt: Date.now()
  });
  toast('Envoyé pour validation à tes parents \u2728');
}

async function requestPinReset(profileId, note){
  const p = state.profiles.find(x=>x.id===profileId);
  await db.collection('pin_reset_requests').add({
    profileId, profileName: p? p.name : '', note: note||'', status:'pending', createdAt: Date.now()
  });
}
async function decidePinReset(req, approve, newPin, me){
  try{
    if(approve){
      await db.collection('profiles').doc(req.profileId).update({pin:newPin});
      await pushActivity({type:'pin_reset', childName:req.profileName, byId:me.id, byName:me.name});
      toast('Nouveau code enregistré pour '+req.profileName);
    } else {
      toast('Demande ignorée');
    }
  } catch(e){
    console.error(e);
    toast('Une erreur est survenue \u2014 réessaie.');
  } finally {
    await db.collection('pin_reset_requests').doc(req.id).delete();
  }
}

async function proposeTask(name, minutes, multiplier, category){
  const me = currentProfile();
  await db.collection('proposals').add({
    name, theoreticalMinutes:minutes, multiplier, category: category||'Autre', proposedBy: me.id, proposedByName: me.name,
    status:'pending', createdAt: Date.now()
  });
  toast('Proposition envoyée aux parents');
}

async function decideSubmission(sub, approve, finalMinutes){
  const me = currentProfile();
  try{
    if(approve){
      const awarded = Math.round(finalMinutes * (sub.multiplier||1));
      await pushWalletHistory(sub.submittedBy, {
        type:'validation', label:sub.taskName, amountMinutes: awarded,
        byId: me.id, byName: me.name
      });
      await pushActivity({type:'validation', taskName:sub.taskName, childId:sub.submittedBy, childName:sub.submittedByName, finalMinutes, awarded, byId:me.id, byName:me.name});
      toast(profileName(sub.submittedBy)+' gagne '+fmtMin(awarded)+' d\u2019écran');
    } else {
      await pushActivity({type:'rejection', taskName:sub.taskName, childId:sub.submittedBy, childName:sub.submittedByName, byId:me.id, byName:me.name});
      toast('Demande refusée');
    }
  } catch(e){
    console.error(e);
    toast('Une erreur est survenue \u2014 réessaie.');
  } finally {
    await db.collection('submissions').doc(sub.id).delete();
  }
}

async function decideProposal(prop, approve){
  const me = currentProfile();
  try{
    if(approve){
      await db.collection('tasks').add({
        name:prop.name, theoreticalMinutes:prop.theoreticalMinutes, multiplier:prop.multiplier, category: prop.category||'Autre',
        recurring:true, active:true, createdAt: Date.now(), createdBy: me.id
      });
      await pushActivity({type:'proposal_accepted', taskName:prop.name, byId:me.id, byName:me.name, childName:prop.proposedByName});
      toast('Nouvelle tâche ajoutée au catalogue');
    } else {
      await pushActivity({type:'proposal_rejected', taskName:prop.name, byId:me.id, byName:me.name, childName:prop.proposedByName});
      toast('Proposition refusée');
    }
  } catch(e){
    console.error(e);
    toast('Une erreur est survenue \u2014 réessaie.');
  } finally {
    await db.collection('proposals').doc(prop.id).delete();
  }
}

async function adjustWallet(childId, amount, note, byMe){
  const awarded = amount;
  await pushWalletHistory(childId, {type:'adjustment', label: note || (awarded<0?'Ajustement':'Ajout manuel'), amountMinutes: awarded, byId:byMe.id, byName:byMe.name});
  await pushActivity({type:'adjustment', childId, childName: profileName(childId), amount: awarded, note, byId:byMe.id, byName:byMe.name});
  toast((awarded>=0?'+':'')+fmtMin(awarded)+' pour '+profileName(childId));
}

async function toggleTimer(childId){
  const me = currentProfile();
  const t = state.timers[childId] || {running:false, startedAt:null};
  if(!t.running){
    await db.collection('timers').doc(childId).set({running:true, startedAt: Date.now()});
  } else {
    const elapsedMs = Date.now() - (t.startedAt||Date.now());
    const elapsedMin = Math.max(1, Math.round(elapsedMs/60000));
    await db.collection('timers').doc(childId).set({running:false, startedAt:null});
    const newBal = await pushWalletHistory(childId, {type:'timer', label:'Temps d\u2019écran utilisé', amountMinutes: -elapsedMin, byId: me.id, byName: me.name});
    await pushActivity({type:'timer', childId, childName: profileName(childId), minutes: elapsedMin, byId: me.id, byName: me.name});
    toast(fmtMin(elapsedMin)+' décomptées \u2014 solde '+fmtMin(newBal));
  }
}

/* ---------------- task timer (chrono d'une tâche en cours) ---------------- */
async function startTaskTimer(task){
  const me = currentProfile();
  if(state.taskTimers[me.id]){ toast('Termine d\u2019abord "'+state.taskTimers[me.id].taskName+'" avant de commencer une autre tâche.'); return; }
  await db.collection('task_timers').doc(me.id).set({
    taskId: task.id, taskName: task.name, theoreticalMinutes: task.theoreticalMinutes,
    multiplier: task.multiplier, category: task.category||'Autre', startedAt: Date.now()
  });
  toast('Chrono démarré pour \u00ab '+task.name+' \u00bb');
}
async function cancelTaskTimer(profileId){
  await db.collection('task_timers').doc(profileId).delete();
  toast('Chrono annulé');
}
function elapsedTaskMinutes(tt){
  return Math.max(1, Math.round((Date.now()-(tt.startedAt||Date.now()))/60000));
}

async function addOrEditTask(data, existingId){
  if(existingId){
    await db.collection('tasks').doc(existingId).update(data);
    toast('Tâche mise à jour');
  } else {
    await db.collection('tasks').add({...data, createdAt: Date.now(), createdBy: currentProfile()?.id});

}
async function toggleTaskActive(task){

}
async function addProfile(data){
  const id = uid('p');
  await db.collection('profiles').doc(id).set({...data, createdAt: Date.now()});
  if(data.role==='child'){
    await db.collection('wallets').doc(id).set({childId:id, name:data.name, balanceMinutes:0, history:[], updatedAt:nowISO()});
    await db.collection('timers').doc(id).set({running:false, startedAt:null});
  }
  toast('Profil ajouté');
}
async function updateProfile(id, data){
  await db.collection('profiles').doc(id).update(data);
  toast('Profil mis à jour');
}

/* ---------------- timer ticker ---------------- */
let tickerStarted = false;
function startTimerTicker(){
  if(tickerStarted) return; tickerStarted = true;
  setInterval(()=>{
    Object.keys(state.timers).forEach(cid=>{
      const t = state.timers[cid];
      if(t && t.running){
        const span = document.getElementById('live-'+cid);
        if(span){
          const w = state.wallets[cid];
          const base = w? w.balanceMinutes : 0;
          const elapsedMin = (Date.now()-(t.startedAt||Date.now()))/60000;
          span.textContent = fmtMin(base - elapsedMin);
        }
      }
    });
    Object.keys(state.taskTimers).forEach(pid=>{
      const tt = state.taskTimers[pid];
      if(tt){
        const span = document.getElementById('tasktimer-live-'+pid);
        if(span) span.textContent = fmtMin(elapsedTaskMinutes(tt));
      }
    });
  }, 1000);
}

function render(){

  if(!state.dbAvailable){
    root.innerHTML = renderUnavailable();
    return;
  }
  if(!state.profilesLoaded){
    root.innerHTML = `<div class="login-wrap"><p class="muted">Chargement\u2026</p></div>`;

  }
  if(state.profiles.length === 0){
    root.innerHTML = renderSetup();

    return;
  }
  if(!state.currentProfileId || !currentProfile()){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  root.innerHTML = renderShell();
  bindShell();
}

function renderResetModal(){
  const already = state.pinResets;

  <p class="muted" style="margin-bottom:14px;">Choisis pour qui, puis un parent devra valider la demande dans l\u2019application avant que le nouveau code soit actif. Personne ne peut choisir son propre code ici.</p>

function bindResetModal(){
  let target = null;
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-reset-target]').forEach(b=>{
    b.addEventListener('click', ()=>{
      target = b.dataset.resetTarget;
      document.querySelectorAll('[data-reset-target]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('resetSubmit').disabled = false;
    });
  });
  document.getElementById('resetSubmit').addEventListener('click', async ()=>{
    const err = document.getElementById('resetError');
    if(!target){ err.textContent = 'Choisis d\u2019abord une personne.'; return; }
    err.textContent = '';
    const note = document.getElementById('resetNote').value.trim();
    await requestPinReset(target, note);
    toast('Demande envoyée \u2014 un parent doit la valider dans l\u2019application');
    closeModal();
  });
}
function bindLogin(){
  const forgotBtn = document.getElementById('forgotPinBtn');
  if(forgotBtn) forgotBtn.addEventListener('click', ()=>{ openModal(renderResetModal()); bindResetModal(); });
  document.querySelectorAll('[data-login]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.pinTargetProfile = b.dataset.login;
      state.pinBuffer=''; state.pinError='';
      render();
    });
  });
  const back = document.getElementById('pinBack');
  if(back) back.addEventListener('click', ()=>{ state.pinTargetProfile=null; state.pinBuffer=''; state.pinError=''; render(); });
  document.querySelectorAll('[data-key]').forEach(k=>{
    k.addEventListener('click', ()=>{
      const key = k.dataset.key;
      if(key==='back'){ state.pinBuffer = state.pinBuffer.slice(0,-1); render(); return; }
      if(state.pinBuffer.length>=4) return;
      state.pinBuffer += key;
      if(state.pinBuffer.length===4){
        const p = state.profiles.find(x=>x.id===state.pinTargetProfile);
        if(p && p.pin === state.pinBuffer){
          state.currentProfileId = p.id;
          sessionStorage.setItem('mst_profile', p.id);
          state.currentTab='accueil'; state.pinBuffer=''; state.pinTargetProfile=null; state.pinError='';
          render();
          return;
        } else {
          state.pinError = 'Code incorrect, réessaie.';
          render();
          setTimeout(()=>{ state.pinBuffer=''; render(); }, 550);
          return;
        }
      }
      render();
    });
  });
}
function logout(){
  state.currentProfileId = null;
  sessionStorage.removeItem('mst_profile');
  render();
}

      mult = parseFloat(b.dataset.tfmult);
      document.querySelectorAll('[data-tfmult]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    });
  });
  document.querySelectorAll('[data-tfcat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      category = b.dataset.tfcat;
      document.querySelectorAll('[data-tfcat]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    });
  });
  document.querySelectorAll('[data-tfrecur]').forEach(b=>{
    b.addEventListener('click', ()=>{
      recur = b.dataset.tfrecur==='true';
      document.querySelectorAll('[data-tfrecur]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    });
  });
  document.getElementById('tfSubmit').addEventListener('click', ()=>{
    const name = document.getElementById('tfName').value.trim();
    const min = parseInt(document.getElementById('tfMin').value,10);
    if(!name || !min) return;
    addOrEditTask({name, theoreticalMinutes:min, multiplier:mult, category, recurring:recur, active: t? t.active!==false : true}, t?t.id:null);
    closeModal();
  });
  const toggleBtn = document.getElementById('tfToggle');
  if(toggleBtn) toggleBtn.addEventListener('click', ()=>{ toggleTaskActive(t); closeModal(); });
}

/* ---------------- Historique ---------------- */
function renderHistorique(me){
  const kids = children();
  return `<div class="stack">
    ${kids.length>1 ? `<div class="pill-row" id="histFilter">
      <button class="pill-btn sel" data-histf="all">Tous</button>
      ${kids.map(k=>`<button class="pill-btn" data-histf="${k.id}">${esc(k.name)}</button>`).join('')}
    </div>` : ''}
    <div class="card tight" id="histList">
      ${renderHistList('all')}
    </div>
  </div>`;
}
function renderHistList(filter){
  let items = state.activity.slice().reverse();
  if(filter !== 'all') items = items.filter(a=> a.childId===filter );
  if(items.length===0) return `<div class="empty"><div class="big">\u{1F4CB}</div>Aucune activité pour l\u2019instant.</div>`;
  return items.slice(0,60).map(a=>{
    let icon='\u2022', text='', amt=null;
    if(a.type==='validation'){ icon='\u2705'; text=`<b>${esc(a.childName)}</b> a validé "${esc(a.taskName)}"`; amt = a.awarded; }
    else if(a.type==='rejection'){ icon='\u274C'; text=`Demande de <b>${esc(a.childName)}</b> refusée \u2014 "${esc(a.taskName)}"`; }
    else if(a.type==='timer'){ icon='\u{1F4F1}'; text=`<b>${esc(a.childName)}</b> a utilisé son temps d\u2019écran`; amt=-a.minutes; }
    else if(a.type==='adjustment'){ icon='\u270F\uFE0F'; text=`Ajustement pour <b>${esc(a.childName)}</b>${a.note?' \u2014 '+esc(a.note):''}`; amt=a.amount; }
    else if(a.type==='parent_done'){ icon='\u{1F9F9}'; text=`<b>${esc(a.byName)}</b> a fait "${esc(a.taskName)}"`; }
    else if(a.type==='proposal_accepted'){ icon='\u2728'; text=`"${esc(a.taskName)}" proposée par <b>${esc(a.childName)}</b> ajoutée au catalogue`; }
    else if(a.type==='proposal_rejected'){ icon='\u{1F6AB}'; text=`Proposition "${esc(a.taskName)}" de <b>${esc(a.childName)}</b> refusée`; }
    else if(a.type==='pin_reset'){ icon='\u{1F510}'; text=`Code de <b>${esc(a.childName)}</b> réinitialisé par ${esc(a.byName)}`; }
    const bg = amt==null? 'var(--surface-2)' : amt>=0? 'var(--moss-tint)':'var(--brick-tint)';
    const col = amt==null? 'var(--text-soft)' : amt>=0? 'var(--moss-deep)':'var(--brick)';
    return `<div class="hist-item">
      <div class="hist-icon" style="background:${bg};">${icon}</div>
      <div class="hist-text"><div>${text}</div><div class="hist-time">${fmtTime(a.at)}</div></div>
      ${amt!=null? `<div class="hist-amount" style="color:${col};">${fmtSigned(amt)}</div>`:''}
    </div>`;
  }).join('');
}
function bindHistorique(me){
  document.querySelectorAll('[data-histf]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('[data-histf]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('histList').innerHTML = renderHistList(b.dataset.histf);
    });
  });
}

/* ---------------- Réglages ---------------- */
function renderReglages(me){
  const archived = state.tasks.filter(t=>!t.active);
  return `<div class="stack">
    <div>
      <div class="section-title">Profils de la famille</div>
      <div class="card tight">
        ${state.profiles.map(p=>{
          const c = COLORS[p.color]||COLORS.moss;
          return `<div class="task-item">
            <div class="avatar" style="background:${c.tint};color:${c.deep};">${esc(p.emoji||p.name[0])}</div>
            <div class="task-info"><div class="task-name">${esc(p.name)}</div><div class="task-meta">${p.role==='parent'?'Parent':'Enfant'} \u00b7 code ${p.pin}</div></div>
            <button class="btn-icon" data-edit-profile="${p.id}">\u270F\uFE0F</button>
          </div>`;
        }).join('')}
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="addProfileBtn">+ Ajouter un profil</button>
    </div>
    <p class="muted" style="padding:0 4px;">Le code à 4 chiffres sert juste à identifier qui utilise l\u2019application sur l\u2019appareil partagé \u2014 ce n\u2019est pas une protection de sécurité.</p>
    <div>
      <div class="section-title">\u{1F5D1}\uFE0F Corbeille \u2014 tâches archivées ${archived.length? '('+archived.length+')':''}</div>
      <div class="card tight">
        ${archived.length===0 ? `<div class="empty">La corbeille est vide.</div>` :
          archived.map(t=>`<div class="task-item">
            <div class="task-dot" style="background:var(--brick)"></div>
            <div class="task-info">
              <div class="task-name">${esc(t.name)}</div>
              <div class="task-meta">${CATEGORY_ICONS[t.category]||''} ${esc(t.category||'Autre')} \u00b7 ${fmtMin(t.theoreticalMinutes)} \u00b7 x${t.multiplier}</div>
            </div>
            <button class="btn btn-ghost btn-sm" data-restore-task="${t.id}">Restaurer</button>
            <button class="btn-icon" data-delete-task="${t.id}" title="Supprimer définitivement">\u{1F5D1}\uFE0F</button>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}
function bindReglages(me){
  document.getElementById('addProfileBtn').addEventListener('click', ()=>{ openModal(renderProfileFormModal(null)); bindProfileFormModal(null); });
  document.querySelectorAll('[data-edit-profile]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = state.profiles.find(x=>x.id===b.dataset.editProfile);
      openModal(renderProfileFormModal(p)); bindProfileFormModal(p);
    });
  });
  document.querySelectorAll('[data-restore-task]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      await db.collection('tasks').doc(b.dataset.restoreTask).update({active:true});
      toast('Tâche restaurée');
    });
  });
  document.querySelectorAll('[data-delete-task]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const t = state.tasks.find(x=>x.id===b.dataset.deleteTask);
      if(t){ openModal(renderDeleteTaskModal(t)); bindDeleteTaskModal(t); }
    });
  });
}
function renderDeleteTaskModal(t){
  return `<div class="modal-head"><h2>Supprimer définitivement ?</h2><button class="x-btn" id="mClose">&times;</button></div>
  <div class="stack">
    <p class="muted">\u00ab ${esc(t.name)} \u00bb sera supprimée pour de bon. Cette action est irréversible.</p>
    <button class="btn btn-stop btn-block" id="confirmDeleteTask">Supprimer définitivement</button>
    <button class="btn btn-ghost btn-block" id="cancelDeleteTask">Annuler</button>
  </div>`;
}
function bindDeleteTaskModal(t){
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('cancelDeleteTask').addEventListener('click', closeModal);
  document.getElementById('confirmDeleteTask').addEventListener('click', async ()=>{
    await db.collection('tasks').doc(t.id).delete();
    toast('Tâche supprimée');
    closeModal();
  });
}
function renderProfileFormModal(p){
  const colorKeys = Object.keys(COLOR_HEX);
  return `<div class="modal-head"><h2>${p?'Modifier le profil':'Nouveau profil'}</h2><button class="x-btn" id="mClose">&times;</button></div>
  <div class="stack">
    <div class="field"><label>Prénom</label><input id="pfName" value="${p?esc(p.name):''}"></div>
    <div class="field"><label>Rôle</label>
      <div class="pill-row">
        <button class="pill-btn ${(!p||p.role==='parent')?'sel':''}" data-pfrole="parent">Parent</button>
        <button class="pill-btn ${(p&&p.role==='child')?'sel':''}" data-pfrole="child">Enfant</button>
      </div>
    </div>
    <div class="field"><label>Code (4 chiffres)</label><input id="pfPin" inputmode="numeric" maxlength="4" value="${p?esc(p.pin):''}"></div>
    <div class="field"><label>Couleur</label>
      <div class="color-row">${colorKeys.map(c=>`<div class="color-dot ${p&&p.color===c?'sel':(!p&&c==='moss'?'sel':'')}" data-pfcolor="${c}" style="background:${COLOR_HEX[c]}"></div>`).join('')}</div>
    </div>
    <button class="btn btn-primary btn-block" id="pfSubmit">${p?'Enregistrer':'Créer le profil'}</button>
  </div>`;
}
function bindProfileFormModal(p){
  let role = p? p.role : 'parent';
  let color = p? p.color : 'moss';
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-pfrole]').forEach(b=>{
    b.addEventListener('click', ()=>{ role=b.dataset.pfrole; document.querySelectorAll('[data-pfrole]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
  });
  document.querySelectorAll('[data-pfcolor]').forEach(b=>{
    b.addEventListener('click', ()=>{ color=b.dataset.pfcolor; document.querySelectorAll('[data-pfcolor]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
  });
  document.getElementById('pfPin').addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\D/g,'').slice(0,4); });
  document.getElementById('pfSubmit').addEventListener('click', ()=>{
    const name = document.getElementById('pfName').value.trim();
    const pin = document.getElementById('pfPin').value;
    if(!name || !/^\d{4}$/.test(pin)) return;
    const emoji = role==='parent' ? '\u{1F9D1}' : '\u{1F9D2}';
    if(p){ updateProfile(p.id, {name, role, pin, color}); }
    else { addProfile({name, role, pin, color, emoji}); }
    closeModal();
  });
}

/* ---------------- go ---------------- */
init();
</script>
</body>
</html>
